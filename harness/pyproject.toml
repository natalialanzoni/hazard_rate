# The impossiblebench family's pinned env: the shared inspect wrapper + the upstream
# impossiblebench package (which brings inspect_evals[swe_bench], swebench, datasets).
# The experiment declarations are package.nix; this project only pins the software —
# a uv "virtual" project (package = false): nothing local to build, the tasks come
# from upstream and the adapters select them via `pkg:impossiblebench:<task_fn>`.
# Bump the rev deliberately: it re-versions every impossiblebench experiment's
# conditions (the pin is part of the family subtree).
[project]
name = "adb-experiment-impossiblebench"
version = "0.1.0"
description = "ImpossibleBench (impossible SWE-bench / LiveCodeBench variants) as ADB experiments"
requires-python = ">=3.13"
dependencies = [
    "adb-inspect",
    "impossiblebench",
]

[tool.uv]
package = false

[tool.uv.sources]
adb-inspect = {git = "https://github.com/antimemetics-institute/agentdatabank", subdirectory = "lib/adb-inspect", rev = "aa13809c9ca71123a618083784835a09741a2283"}
# local checkout of upstream impossiblebench, cloned at rev 061dc3dce6a9 (the rev
# ADB's registry pins) so behaviour starts identical and every divergence is a
# deliberate edit. It lives inside this experiment's src, so `nix-build` sees it and
# its content re-versions conditions — patching the benchmark shows up in the hash.
impossiblebench = { path = "vendor-impossiblebench" }

[dependency-groups]
dev = ["pytest>=8"]
